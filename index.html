<!DOCTYPE html>
<!--
  ============================================================
  PORTADA DE REPORTES
  ------------------------------------------------------------
  PARA AGREGAR UN REPORTE NUEVO:
    1. Sube tu archivo .html a este mismo repositorio.
    2. Abajo, en la lista REPORTES (dentro de <script>), agrega
       un bloque nuevo copiando uno existente y cambiando los datos.
    3. Guarda. Listo: aparecerá automáticamente en la portada.

  Cada reporte se define así:
    {
      titulo:      "Nombre visible del reporte",
      archivo:     "nombre-del-archivo.html",   // tal cual lo subiste
      descripcion: "Una línea explicando de qué trata",
      fecha:       "2026-06-01",                // formato AAAA-MM-DD
      etiqueta:    "Ventas"                     // categoría libre, opcional
    }
  ============================================================
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f1ea;
    --ink:#1a1815;
    --ink-soft:#5c574e;
    --line:#d8d2c5;
    --accent:#c2410c;
    --card:#fbfaf6;
    --shadow:rgba(26,24,21,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    min-height:100vh;
    padding:clamp(1.5rem,5vw,5rem);
    background-image:radial-gradient(var(--line) 0.5px,transparent 0.5px);
    background-size:22px 22px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:1.8rem;
    margin-bottom:0.5rem;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:1rem;
  }
  .title-block .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:0.6rem;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:clamp(2.6rem,7vw,4.6rem);
    line-height:0.92;
    letter-spacing:-0.02em;
  }
  .meta{
    text-align:right;
    font-size:0.78rem;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .meta b{color:var(--ink);font-weight:500;}

  .toolbar{
    display:flex;
    gap:1rem;
    align-items:center;
    margin:2.2rem 0 2.6rem;
    flex-wrap:wrap;
  }
  #buscar{
    flex:1;
    min-width:220px;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:2px;
    padding:0.85rem 1.1rem;
    font-family:inherit;
    font-size:0.9rem;
    color:var(--ink);
    transition:border-color .2s;
  }
  #buscar:focus{outline:none;border-color:var(--accent);}
  #buscar::placeholder{color:var(--ink-soft);}
  .count{
    font-size:0.78rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:1.2rem;
  }
  a.card{
    display:block;
    text-decoration:none;
    color:inherit;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:3px;
    padding:1.6rem 1.5rem 1.4rem;
    position:relative;
    overflow:hidden;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  }
  a.card::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:4px;
    background:var(--accent);
    transform:scaleY(0);
    transform-origin:top;
    transition:transform .22s ease;
  }
  a.card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 30px var(--shadow);
    border-color:var(--ink);
  }
  a.card:hover::before{transform:scaleY(1);}
  .card .etiqueta{
    display:inline-block;
    font-size:0.66rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:2px;
    padding:0.18rem 0.5rem;
    margin-bottom:1.1rem;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.45rem;
    line-height:1.12;
    letter-spacing:-0.01em;
    margin-bottom:0.6rem;
  }
  .card p{
    font-size:0.82rem;
    color:var(--ink-soft);
    line-height:1.55;
    margin-bottom:1.4rem;
  }
  .card .pie{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.72rem;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:0.9rem;
  }
  .card .ver{color:var(--ink);font-weight:500;}
  .card .ver::after{content:" →";color:var(--accent);}

  .vacio{
    grid-column:1/-1;
    text-align:center;
    padding:4rem 1rem;
    color:var(--ink-soft);
    font-size:0.9rem;
  }
  footer{
    margin-top:3.5rem;
    padding-top:1.4rem;
    border-top:1px solid var(--line);
    font-size:0.72rem;
    color:var(--ink-soft);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <div class="eyebrow">Centro de informes</div>
      <h1>Reportes</h1>
    </div>
    <div class="meta">
      <div>Total: <b id="total">0</b> reportes</div>
      <div>Actualizado · <b id="hoy"></b></div>
    </div>
  </header>

  <div class="toolbar">
    <input id="buscar" type="text" placeholder="Buscar por título, descripción o etiqueta…" autocomplete="off">
    <span class="count" id="contador"></span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    Para agregar un reporte: sube el .html al repositorio y añade una entrada en la lista del código fuente de esta página.
  </footer>
</div>

<script>
  /* ===========================================================
     LISTA DE REPORTES — edita solo esta parte.
     Copia un bloque, pégalo y cambia los datos para sumar uno.
     =========================================================== */
  const REPORTES = [
    {
      titulo: "Falabella-4-010626-1P/Relevante",
      archivo: "reporte_falabella_4_cl_010626.html",
      descripcion: "Estado de los datos solicitados",
      fecha: "2026-06-01",
      etiqueta: "Cyber CL"
    },
    {
      titulo: "Falabella-1142-0106-3P/Relevante",
      archivo: "reporte_falabella_1142_010626.html",
      descripcion: "Estado de los datos solicitados",
      fecha: "2026-06-01",
      etiqueta: "Cyber CL"
    },
    {
      // titulo: "Ejemplo: Retención de clientes",
      // archivo: "retencion.html",
      // descripcion: "Cohortes y tasas de recompra del último semestre.",
      // fecha: "2026-05-20",
     //  etiqueta: "Clientes"
    }
  ];
  /* =========================================================== */

  const grid = document.getElementById('grid');
  const buscar = document.getElementById('buscar');
  const contador = document.getElementById('contador');
  document.getElementById('total').textContent = REPORTES.length;
  document.getElementById('hoy').textContent = new Date().toLocaleDateString('es-CL', {day:'2-digit', month:'short', year:'numeric'});

  function fmtFecha(f){
    if(!f) return '';
    const d = new Date(f + 'T00:00:00');
    if(isNaN(d)) return f;
    return d.toLocaleDateString('es-CL', {day:'2-digit', month:'short', year:'numeric'});
  }

  function render(lista){
    grid.innerHTML = '';
    if(lista.length === 0){
      grid.innerHTML = '<div class="vacio">No hay reportes que coincidan con tu búsqueda.</div>';
      contador.textContent = '';
      return;
    }
    // Más recientes primero
    lista.sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
    lista.forEach(r => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = r.archivo;
      a.innerHTML = `
        ${r.etiqueta ? `<span class="etiqueta">${r.etiqueta}</span>` : ''}
        <h2>${r.titulo}</h2>
        ${r.descripcion ? `<p>${r.descripcion}</p>` : ''}
        <div class="pie">
          <span>${fmtFecha(r.fecha)}</span>
          <span class="ver">Ver reporte</span>
        </div>`;
      grid.appendChild(a);
    });
    contador.textContent = lista.length + ' visible' + (lista.length === 1 ? '' : 's');
  }

  buscar.addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    render(REPORTES.filter(r =>
      (r.titulo + ' ' + (r.descripcion||'') + ' ' + (r.etiqueta||'')).toLowerCase().includes(q)
    ));
  });

  render([...REPORTES]);
</script>
</body>
</html>
